name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-24.04-arm
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: AnswerDotAI/.github/actions/sccache@main
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build Python wheel
        uses: AnswerDotAI/.github/actions/maturin-build@main
        with:
          args: --profile dist --out dist/py-dist ${{ runner.os == 'Linux' && '--zig' || '' }}
          manylinux: '2_31'

      - name: Package release assets
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          arch="$(uname -m)"
          asset="sbrun-${tag}-${{ matrix.platform }}-${arch}.tar.gz"
          default_conf="sbrun.default.${{ matrix.platform }}.toml"
          mkdir -p dist/pkg
          python -c 'import glob, os, zipfile; w = zipfile.ZipFile(glob.glob("dist/py-dist/*.whl")[0]); m = next(n for n in w.namelist() if n.endswith(".data/scripts/sbrun")); open("dist/pkg/sbrun", "wb").write(w.read(m)); os.chmod("dist/pkg/sbrun", 0o755)'
          cp README.md "$default_conf" dist/pkg/
          tar -C dist/pkg -czf "dist/${asset}" .
          shasum -a 256 "dist/${asset}" > "dist/SHA256SUMS-${{ matrix.platform }}-${arch}"
          printf 'RELEASE_ASSET=%s\n' "dist/${asset}" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            dist/py-dist/*.whl
            dist/sbrun-*.tar.gz
            dist/SHA256SUMS-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Combine checksums
        run: cat artifacts/SHA256SUMS-* > artifacts/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=(artifacts/sbrun-*.tar.gz artifacts/SHA256SUMS artifacts/py-dist/*.whl)
          gh release create "${tag}" "${assets[@]}" --repo "${GH_REPO}" --generate-notes

  pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/py-dist
