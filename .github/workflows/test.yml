name: test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: AnswerDotAI/.github/actions/sccache@main
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}

      - name: Set up uv
        uses: AnswerDotAI/.github/actions/setup-uv@main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Test Dependencies
        run: uv pip install --system 'pytest>=8'

      - name: Allow Linux user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0

      - name: Full Test Suite
        run: tools/test.sh
